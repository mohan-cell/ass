<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assistant Dashboard - Manage Content</title>
    <link rel="stylesheet" href="assistant.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body tabindex="-1">

    <div id="authSection" class="auth-container">
        <div class="auth-card">
            <img src="logo.png" alt="K-OTT Logo" style="height: 65px; margin-bottom: 1rem; object-fit: contain;" onerror="this.style.display='none'">
            <h2 style="color:var(--primary); margin-bottom:1rem;">Assistant Portal</h2>
            <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:1rem;">Enter your AST- code to manage content.</p>
            <div class="form-group">
                <input type="text" id="activationCode" class="auth-input" placeholder="AST-XXXXXXXX">
            </div>
            <button class="auth-btn" onclick="activate()">Login to Database</button>
        </div>
    </div>

    <div id="appSection" class="dashboard" style="display: none;">
        <aside class="sidebar">
            <div style="text-align: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem;">
                <img src="logo.png" alt="K-OTT Logo" style="height: 60px; max-width: 100%; object-fit: contain; margin-bottom: 10px;" onerror="this.style.display='none'">
                <h2 style="color: var(--primary); margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px;">Content Hub</h2>
            </div>
            
            <ul>
                <li>Manage Content</li>
            </ul>
            <button class="btn" style="width:100%; margin-top:2rem;" onclick="logout()">Logout</button>
        </aside>
        
        <main class="main-content">
            <div class="card">
                <h3 id="form-title" style="margin-bottom: 1rem;">Add New Content</h3>
                
                <form id="add-movie-form" style="display:flex; flex-direction:column; gap:10px; margin-bottom:2rem; border-bottom:1px solid var(--border-color); padding-bottom:2rem;">
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="m-title" placeholder="Title" required>
                        <input type="url" id="m-img" placeholder="Image URL" required>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="m-cat" placeholder="Category (e.g. trailers, live movies)" required>
                        <input type="text" id="m-lang" placeholder="Language" required>
                        <select id="m-type">
                            <option>Movie</option>
                            <option>Web Series</option>
                        </select>
                    </div>
                    <input type="url" id="m-link" placeholder="Video Embed Link" required>
                    
                    <div style="display:flex; gap:10px;">
                        <button type="submit" id="submit-btn" class="btn btn-primary" style="flex:1;">Save to Database</button>
                        <button type="button" id="cancel-btn" class="btn btn-danger" style="display:none; padding: 10px;" onclick="resetMovieForm()">Cancel Edit</button>
                    </div>
                </form>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                    <h3>Content Database</h3>
                    <input type="text" id="movieSearch" placeholder="Search by Category..." onkeyup="filterMovies()" style="width:250px; padding:0.5rem;">
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>Thumbnail</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Language</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="movieTable"></tbody>
                </table>
            </div>
        </main>
    </div>
